name: Android build

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: "RIHAL_SERVER_URL (اتركه فارغًا للوضع المضمَّن)"
        required: false
        default: ""
  push:
    tags:
      - "android-v*"
    paths:
      - "apps/mobile/**"
      - "apps/api/public/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "apps/mobile/**"
      - "apps/api/public/**"
      - ".github/workflows/android.yml"

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: APK + AAB
    runs-on: ubuntu-latest
    env:
      RIHAL_SERVER_URL: ${{ github.event.inputs.server_url || vars.RIHAL_SERVER_URL || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Copy the console into the mobile shell
        run: pnpm --filter @rihal/mobile prepare:web

      - name: Sync Capacitor assets
        run: pnpm --filter @rihal/mobile cap:sync

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode signing keystore (optional)
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/rihal-release.jks"
          cat > apps/mobile/android/keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/rihal-release.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Build debug APK
        working-directory: apps/mobile/android
        run: ./gradlew --no-daemon assembleDebug

      - name: Build release bundle
        working-directory: apps/mobile/android
        run: ./gradlew --no-daemon bundleRelease assembleRelease

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rihal-android-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            apps/mobile/android/app/build/outputs/apk/debug/*.apk
            apps/mobile/android/app/build/outputs/apk/release/*.apk
            apps/mobile/android/app/build/outputs/bundle/release/*.aab
