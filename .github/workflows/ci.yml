name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Admin connection is only used to provision the two isolated roles and
      # as a fixture connection for tenant-independent test setup.
      ADMIN_DATABASE_URL: postgresql://rihal:rihal@localhost:5432/rihal?schema=public
      TEST_ADMIN_DATABASE_URL: postgresql://rihal:rihal@localhost:5432/rihal?schema=public
      # The provisioning step replaces these values in GITHUB_ENV before any
      # migration or test connects to PostgreSQL.
      DATABASE_URL: postgresql://rihal:rihal@localhost:5432/rihal?schema=public
      DIRECT_URL: postgresql://rihal:rihal@localhost:5432/rihal?schema=public
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: rihal
          POSTGRES_USER: rihal
          POSTGRES_PASSWORD: rihal
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rihal -d rihal"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @rihal/database db:generate
      - name: Provision isolated PostgreSQL roles
        run: pnpm --filter @rihal/database db:provision-roles
      - run: pnpm --filter @rihal/database exec prisma migrate reset --force --skip-seed
      - run: pnpm --filter @rihal/database db:seed
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      - run: test -s apps/api/dist/main.js
      - run: pnpm audit --prod
